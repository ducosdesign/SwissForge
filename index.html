<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissForge | Grid Layout Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .swiss-headline { font-family: 'Inter', sans-serif; line-height: 0.9; letter-spacing: -0.04em; }
        
        /* The "Skeleton" Grid Styles */
        .poster-grid {
            display: grid;
            gap: 1.5rem;
            height: 100%;
            width: 100%;
        }

        /* Generated Grid Templates */
        .grid-style-1 { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; }
        .grid-style-2 { grid-template-columns: 1fr 2fr; grid-template-rows: 1fr 1fr; }
        .grid-style-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto 1fr; }

        .placeholder-img { background-color: #d1d5db; position: relative; overflow: hidden; }
        .placeholder-img::after { 
            content: "IMG"; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); color: rgba(0,0,0,0.2); font-weight: bold; font-size: 10px;
        }
        
        .poster-canvas { transition: all 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-zinc-200 text-zinc-900 h-screen flex">

    <aside class="w-80 border-r border-zinc-300 bg-white p-8 flex flex-col shadow-2xl z-20">
        <header class="mb-10">
            <h1 class="text-2xl font-black italic tracking-tighter">SWISSFORGE</h1>
            <p class="text-[9px] text-zinc-400 uppercase font-bold tracking-[0.2em] mt-1">Grid Layout Generator</p>
        </header>

        <div class="space-y-6 flex-1">
            <div>
                <label class="text-[10px] font-bold uppercase text-zinc-500 block mb-2">Primary Text</label>
                <input type="text" id="mainText" value="Grid System" class="w-full bg-zinc-50 border border-zinc-300 p-3 text-sm font-bold outline-none uppercase focus:border-zinc-900">
            </div>

            <button onclick="generate()" class="w-full bg-zinc-900 text-white py-4 rounded-lg font-bold hover:bg-black transition-all active:scale-95 shadow-lg">
                NEW RANDOM GRID
            </button>
        </div>

        <div class="pt-6 border-t border-zinc-100 text-[10px] text-zinc-400 leading-relaxed italic">
            Swiss design focuses on asymmetric balance and mathematically structured grids.
        </div>
    </aside>

    <main class="flex-1 flex items-center justify-center p-12 bg-zinc-100 relative">
        <div id="poster" class="poster-canvas w-[480px] h-[640px] bg-white shadow-2xl p-8 border border-zinc-200 relative">
            <div id="gridTarget" class="poster-grid">
                </div>
        </div>
    </main>

    <script>
        function generate() {
            const text = document.getElementById('mainText').value || "SWISS";
            const target = document.getElementById('gridTarget');
            
            // Randomly choose a grid template class
            const gridClass = `grid-style-${Math.floor(Math.random() * 3) + 1}`;
            target.className = `poster-grid ${gridClass}`;

            // Define different "Content Modules"
            const modules = [
                `<div class="col-span-full border-b-4 border-zinc-900 pb-2">
                    <h1 class="swiss-headline text-6xl uppercase font-black">${text}</h1>
                </div>`,
                
                `<div class="placeholder-img h-full w-full"></div>`,
                
                `<div class="flex flex-col justify-end">
                    <p class="text-[9px] font-bold leading-tight uppercase">
                        Structure and organization.<br>The modular grid is a tool for the objective designer.
                    </p>
                </div>`,
                
                `<div class="bg-zinc-900 text-white p-4 flex flex-col justify-between">
                    <span class="text-[8px] font-bold uppercase tracking-widest">Data Module</span>
                    <span class="text-3xl font-black">0${Math.floor(Math.random()*9)}</span>
                </div>`,

                `<div class="col-span-1 border-t border-zinc-300 pt-2">
                    <p class="text-[8px] uppercase font-bold text-zinc-400">Section A</p>
                    <div class="h-1 w-full bg-red-500 mt-1"></div>
                </div>`
            ];

            // Shuffle and pick 4-5 modules to fill the grid
            const shuffled = modules.sort(() => 0.5 - Math.random());
            target.innerHTML = shuffled.slice(0, 4).join('');
        }

        // Initialize
        generate();
    </script>
</body>
</html>
